services:

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: nearbuy
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nearbuy"]
      interval: 10s
      timeout: 5s
      retries: 5

  php_api:
    build: ./php
    container_name: php_api
    ports:
      - "8001:80"
    environment:
      - DJANGO_SECRET_KEY=nearbuy_super_secret_jwt_key_2024_shared
    networks:
      default:
        aliases:
          - php-api
    depends_on:
      postgres_db:
        condition: service_healthy

  django_api:
    build: ./django
    container_name: django_api
    command: >
         sh -c "python manage.py makemigrations users &&
         python manage.py migrate &&
         python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=nearbuy
      - DB_USER=admin
      - DB_PASSWORD=admin123
    networks:
      default:
        aliases:
          - django-api
    depends_on:
      postgres_db:
        condition: service_healthy

  springboot-app:
    build: ./springboot
    container_name: springboot_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/nearbuy
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      springboot-app:
        condition: service_started
      django_api:
        condition: service_started
      php_api:
        condition: service_started
  react_front:
    build: ./react
    container_name: react_front
    ports:
      - "3000:3000"
    depends_on:
      - php_api
      - springboot-app

volumes:
  postgres_data:
  uploads_data: