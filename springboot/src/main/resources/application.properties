# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres_db:5432/nearbuy
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — validate only, Flyway handles schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
jwt.secret=nearbuy_super_secret_jwt_key_2024_shared
jwt.expiration=86400000

# Logging
logging.level.com.nearbuy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=DEBUG

# CORS
cors.allowed-origins=http://localhost:3000,http://react_front:3000

# WebSocket
spring.websocket.path=/ws/chat

server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=/app/uploads