# Server
server.port=8080
 
# PostgreSQL (shared DB with Django)
spring.datasource.url=jdbc:postgresql://postgres_db:5432/nearbuy_db
spring.datasource.username=nearbuy_user
spring.datasource.password=nearbuy_pass
spring.datasource.driver-class-name=org.postgresql.Driver
 
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
 
# JWT (must match Django SECRET_KEY or use same shared secret)
jwt.secret=nearbuy_super_secret_jwt_key_2024_shared
jwt.expiration=86400000
 
# Logging
logging.level.com.nearbuy=DEBUG
logging.level.org.springframework.security=INFO
 
# CORS
cors.allowed-origins=http://localhost:3000,http://react_front:3000
 