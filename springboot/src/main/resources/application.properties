# Server
server.port=8080
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres_db:5432/nearbuy
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — validate only, Flyway handles schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.out-of-order=true

# JWT
jwt.secret=nearbuy_super_secret_jwt_key_2024_shared
jwt.expiration=86400000

# Logging
logging.level.com.nearbuy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=DEBUG

# CORS
cors.allowed-origins=http://localhost:3000,http://react_front:3000

# WebSocket
spring.websocket.path=/ws/chat

server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=/app/uploads

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Frontend URL
app.frontend-url=http://localhost:3000

logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client=DEBUG

spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

spring.application.name=springboot-app
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/